name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
            files=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}")
            export CHANGED_FILES="$files"
            python .github/scripts/detect_changes.py
          else
            {
              echo "python=true"
              echo "backend=true"
              echo "crm=true"
              echo "data_pipeline=true"
              echo "broker_ui=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Core Backend Dependencies
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          cd backend-django
          pip install -r requirements.txt
          cd ..

      - name: Install Module Dependencies
        if: steps.changes.outputs.python == 'true'
        run: |
          # Install SQLAlchemy and other core database dependencies
          pip install sqlalchemy

          # Install database module
          if [ -f "db/requirements.txt" ]; then
            echo "Installing database module..."
            pip install -r db/requirements.txt
          fi

          # Install orchestration module
          if [ -f "orchestration/requirements.txt" ]; then
            echo "Installing orchestration module..."
            pip install -r orchestration/requirements.txt
          fi

          # Install government data modules
          if [ -f "gov/requirements.txt" ]; then
            echo "Installing government data modules..."
            pip install -r gov/requirements.txt
          fi

          # Install GIS module
          if [ -f "gis/requirements.txt" ]; then
            echo "Installing GIS module..."
            pip install -r gis/requirements.txt
          fi

          # Install Yad2 module
          if [ -f "yad2/requirements.txt" ]; then
            echo "Installing Yad2 module..."
            pip install -r yad2/requirements.txt
          fi

          # Install RAMI module
          if [ -f "rami/requirements.txt" ]; then
            echo "Installing RAMI module..."
            pip install -r rami/requirements.txt
          fi

          # Install global dependencies
          if [ -f "requirements.txt" ]; then
            echo "Installing global dependencies..."
            pip install -r requirements.txt
          fi

          # Install additional test dependencies that might be missing
          pip install responses pytest-mock pytest-asyncio

      - name: Install Playwright Browsers
        if: steps.changes.outputs.python == 'true'
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Backend Test Suite
        if: steps.changes.outputs.backend == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend-django
        run: |
          echo "Running backend test suite..."

          repo_targets=()
          for d in tests/core tests/db tests/utils tests/e2e; do
            if [ -e "$d" ]; then
              repo_targets+=("$d")
            fi
          done

          if [ ${#repo_targets[@]} -gt 0 ]; then
            echo "pytest repo targets: ${repo_targets[*]}"
            pytest -q --tb=short "${repo_targets[@]}"
          else
            echo "No repo-level backend test directories found"
          fi

          if [ -d "backend-django/tests" ]; then
            echo "Running Django app tests from backend-django/"
            (cd backend-django && pytest -q --tb=short tests)
          else
            echo "No backend-django test directory present"
          fi

      - name: Run CRM Test Suite
        if: steps.changes.outputs.crm == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend-django
        run: |
          echo "Running CRM test suite..."
          targets=()
          if [ -f "backend-django/crm/tests.py" ]; then
            targets+=("backend-django/crm/tests.py")
          fi
          if [ -d "backend-django/crm/tests" ]; then
            targets+=("backend-django/crm/tests")
          fi
          if [ -d "tests/crm" ]; then
            targets+=("tests/crm")
          fi
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No CRM test targets found"
          else
            echo "pytest targets: ${targets[*]}"
            pytest -q --tb=short "${targets[@]}"
          fi

      - name: Run Data Pipeline Test Suite
        if: steps.changes.outputs.data_pipeline == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend-django
        run: |
          echo "Running data pipeline test suite..."
          suites=()
          for d in tests/data tests/gis tests/gov tests/govmap tests/mavat tests/yad2 tests/orchestration tests/rami; do
            if [ -d "$d" ]; then
              suites+=("$d")
            fi
          done
          if [ ${#suites[@]} -gt 0 ]; then
            echo "pytest targets: ${suites[*]}"
            pytest -q --tb=short "${suites[@]}"
          else
            echo "No data pipeline test directories found"
          fi

          for module in orchestration gov gis govmap mavat yad2 rami; do
            if [ -d "$module" ]; then
              echo "Running ${module} module tests..."
              pytest -q --tb=short "$module" || echo "No tests found in ${module} module"
            fi
          done

      - name: Set up Node
        if: steps.changes.outputs.broker_ui == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install UI dependencies
        if: steps.changes.outputs.broker_ui == 'true'
        working-directory: realestate-broker-ui
        run: |
          npm install

      - name: Lint UI
        if: steps.changes.outputs.broker_ui == 'true'
        working-directory: realestate-broker-ui
        run: |
          npm run lint --if-present

      - name: Run UI tests
        if: steps.changes.outputs.broker_ui == 'true'
        working-directory: realestate-broker-ui
        run: |
          npm test --if-present

      - name: Build UI
        if: steps.changes.outputs.broker_ui == 'true'
        working-directory: realestate-broker-ui
        run: |
          npm run build
