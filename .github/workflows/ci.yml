name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
            files=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}")
            export CHANGED_FILES="$files"
            python <<'PY'
            import os

            files = [line.strip() for line in os.environ.get("CHANGED_FILES", "").splitlines() if line.strip()]

            backend = crm = data_pipeline = broker_ui = False
            shared = False

            backend_dirs = {"backend-django", "utils", "db", "scripts"}
            crm_dirs = {"crm"}
            data_pipeline_dirs = {"orchestration", "yad2", "mavat", "gov", "gis", "govmap", "rami"}

            backend_test_dirs = {"core", "db", "utils", "e2e"}
            crm_test_dirs = {"crm"}
            data_pipeline_test_dirs = {"data", "gis", "gov", "govmap", "mavat", "yad2", "orchestration", "rami"}

            shared_files = {"pyproject.toml", "pytest.ini", "pytest-ci.ini", "requirements.txt", "setup.py", "setup_assets.py"}

            for path in files:
                parts = path.split("/") if path else []
                top = parts[0] if parts else ""

                if path in shared_files or path.startswith("tests/conftest.py") or path.startswith("tests/__init__"):
                    shared = True
                    continue

                if top == "realestate-broker-ui":
                    broker_ui = True
                    continue

                if top == "backend-django":
                    if len(parts) > 1 and parts[1] == "crm":
                        crm = True
                    else:
                        backend = True
                    continue

                if top == "tests":
                    if len(parts) == 1:
                        shared = True
                        continue
                    second = parts[1]
                    if second in backend_test_dirs:
                        backend = True
                    elif second in crm_test_dirs:
                        crm = True
                    elif second in data_pipeline_test_dirs:
                        data_pipeline = True
                    else:
                        shared = True
                    continue

                if top in crm_dirs:
                    crm = True
                    continue

                if top in data_pipeline_dirs:
                    data_pipeline = True
                    continue

                if top in backend_dirs or path.endswith(".py"):
                    backend = True

            if shared:
                backend = crm = data_pipeline = True

            python_required = backend or crm or data_pipeline

            output_path = os.environ["GITHUB_OUTPUT"]
            with open(output_path, "a", encoding="utf-8") as fh:
                fh.write(f"python={'true' if python_required else 'false'}\n")
                fh.write(f"backend={'true' if backend else 'false'}\n")
                fh.write(f"crm={'true' if crm else 'false'}\n")
                fh.write(f"data_pipeline={'true' if data_pipeline else 'false'}\n")
                fh.write(f"broker_ui={'true' if broker_ui else 'false'}\n")
PY
          else
            cat <<'EOF' >> "$GITHUB_OUTPUT"
python=true
backend=true
crm=true
data_pipeline=true
broker_ui=true
EOF
          fi

      - name: Set up Python
        if: ${{ steps.changes.outputs.python == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Backend Dependencies
        if: ${{ steps.changes.outputs.python == 'true' }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          cd backend-django
          pip install -r requirements.txt
          cd ..

      - name: Install Module Dependencies
        if: ${{ steps.changes.outputs.python == 'true' }}
        shell: bash
        run: |
          pip install sqlalchemy responses pytest-mock pytest-asyncio
          if [ -f "db/requirements.txt" ]; then pip install -r db/requirements.txt; fi
          if [ -f "orchestration/requirements.txt" ]; then pip install -r orchestration/requirements.txt; fi
          if [ -f "gov/requirements.txt" ]; then pip install -r gov/requirements.txt; fi
          if [ -f "gis/requirements.txt" ]; then pip install -r gis/requirements.txt; fi
          if [ -f "yad2/requirements.txt" ]; then pip install -r yad2/requirements.txt; fi
          if [ -f "rami/requirements.txt" ]; then pip install -r rami/requirements.txt; fi
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install playwright

      - name: Install Playwright Browsers
        if: ${{ steps.changes.outputs.python == 'true' }}
        shell: bash
        run: |
          playwright install --with-deps chromium

      - name: Run Backend Test Suite
        if: ${{ steps.changes.outputs.backend == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          echo "Running backend test suite..."
          dirs=()
          for d in backend-django/tests tests/core tests/db tests/utils tests/e2e; do
            if [ -e "$d" ]; then dirs+=("$d"); fi
          done
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No backend test targets found"
          else
            echo "pytest targets: ${dirs[*]}"
            pytest -q --tb=short "${dirs[@]}"
          fi

      - name: Run CRM Test Suite
        if: ${{ steps.changes.outputs.crm == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          echo "Running CRM test suite..."
          targets=()
          if [ -f "backend-django/crm/tests.py" ]; then targets+=("backend-django/crm/tests.py"); fi
          if [ -d "backend-django/crm/tests" ]; then targets+=("backend-django/crm/tests"); fi
          if [ -d "tests/crm" ]; then targets+=("tests/crm"); fi
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No CRM test targets found"
          else
            echo "pytest targets: ${targets[*]}"
            pytest -q --tb=short "${targets[@]}"
          fi

      - name: Run Data Pipeline Test Suite
        if: ${{ steps.changes.outputs.data_pipeline == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          echo "Running data pipeline test suite..."
          suites=()
          for d in tests/data tests/gis tests/gov tests/govmap tests/mavat tests/yad2 tests/orchestration tests/rami; do
            if [ -d "$d" ]; then suites+=("$d"); fi
          done
          if [ ${#suites[@]} -gt 0 ]; then
            echo "pytest targets: ${suites[*]}"
            pytest -q --tb=short "${suites[@]}"
          else
            echo "No data pipeline test directories found"
          fi

          for module in orchestration gov gis govmap mavat yad2 rami; do
            if [ -d "$module" ]; then
              echo "Running ${module} module tests..."
              pytest -q --tb=short "$module" || echo "No tests found in ${module} module"
            fi
          done

      - name: Set up Node
        if: ${{ steps.changes.outputs.broker_ui == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        if: ${{ steps.changes.outputs.broker_ui == 'true' }}
        working-directory: realestate-broker-ui
        shell: bash
        run: npm install

      - name: Lint UI
        if: ${{ steps.changes.outputs.broker_ui == 'true' }}
        working-directory: realestate-broker-ui
        shell: bash
        run: npm run lint --if-present

      - name: Run UI tests
        if: ${{ steps.changes.outputs.broker_ui == 'true' }}
        working-directory: realestate-broker-ui
        shell: bash
        run: npm run test --if-present

      - name: Build UI
        if: ${{ steps.changes.outputs.broker_ui == 'true' }}
        working-directory: realestate-broker-ui
        shell: bash
        run: npm run build
