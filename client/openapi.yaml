  /api/agent/chat:
    post:
      operationId: agent_chat_create
      description: Chat with the AI real estate agent
      summary: Agent Chat
      tags:
      - Agent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: User message
                chat_history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                  description: Optional chat history
              required:
              - message
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Agent response
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        response:
                          type: string
          description: ''
  /api/agent/chat/stream:
    post:
      operationId: agent_chat_stream_create
      description: Stream chat responses from the AI real estate agent using Server-Sent
        Events.
      tags:
      - agent
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/agent/feedback:
    post:
      operationId: agent_feedback_create
      description: Submit feedback for agent responses
      summary: Agent Feedback
      tags:
      - Agent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                  description: Unique message identifier
                feedback:
                  type: string
                  enum:
                  - positive
                  - negative
                  description: Feedback type
                message_content:
                  type: string
                  description: The assistant message content
                user_message:
                  type: string
                  description: The user message that prompted this response
              required:
              - message_id
              - feedback
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Feedback submitted successfully
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        success:
                          type: boolean
                        message:
                          type: string
          description: ''
  /api/agent/recommendations:
