components:
  schemas:
    AdminUser:
      type: object
      description: Serializer for admin user management with full CRUD operations.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: שם משתמש
          description: שדה חובה. 150 תווים או פחות. אותיות, ספרות ו-@/./+/-/_ בלבד.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          title: שם פרטי
          maxLength: 150
        last_name:
          type: string
          title: שם משפחה
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        company:
          type: string
          nullable: true
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        is_active:
          type: boolean
          title: פעיל
          description: מציין האם יש להתייחס למשתמש כפעיל. יש לבטל בחירה זו במקום למחוק
            חשבונות משתמשים.
        is_active_display:
          type: string
          readOnly: true
        is_verified:
          type: boolean
        is_demo:
          type: boolean
        is_staff:
          type: boolean
          title: סטטוס איש צוות
          description: מציין האם המשתמש יכול להתחבר לאתר הניהול.
