openapi: 3.0.3
info:
  title: Real Estate API
  version: 1.0.0
  description: API schema for assets, permits and plans
paths:
  /api/admin/users:
    get:
      operationId: admin_users_list
      description: Retrieve a paginated list of all users with filtering and search
        capabilities
      summary: List all users
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date
        description: Filter users created after this date
      - in: query
        name: created_before
        schema:
          type: string
          format: date
        description: Filter users created before this date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
        description: Filter by user role
      - in: query
        name: search
        schema:
          type: string
        description: Search by name, email, or username
      - in: query
        name: status
        schema:
          type: string
        description: Filter by active status (active/inactive)
      tags:
      - Admin Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: admin_users_create
      description: Create a new user account
      summary: Create a new user
      tags:
      - Admin Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserCreate'
          description: ''
  /api/admin/users/{id}:
    get:
      operationId: admin_users_retrieve
      description: Get detailed information about a specific user
      summary: Retrieve user details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this משתמש.
        required: true
      tags:
      - Admin Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    put:
      operationId: admin_users_update
      description: Update user information
      summary: Update user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this משתמש.
        required: true
      tags:
      - Admin Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserUpdate'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: Partially update user information
      summary: Partially update user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this משתמש.
        required: true
      tags:
      - Admin Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserUpdate'
          description: ''
    delete:
      operationId: admin_users_destroy
      description: Delete a user account
      summary: Delete user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this משתמש.
        required: true
      tags:
      - Admin Users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/users/{id}/activate:
