steps:
  # Set image tag dynamically (SHORT_SHA from GitHub trigger, or BUILD_ID for manual builds)
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [ -n "$$SHORT_SHA" ]; then
          TAG="$$SHORT_SHA"
          echo "Using SHORT_SHA: $$TAG"
        elif [ -n "$$BUILD_ID" ]; then
          TAG="$$BUILD_ID"
          echo "Using BUILD_ID: $$TAG"
        else
          TAG="manual-$$(date +%s)"
          echo "Using timestamp tag: $$TAG"
        fi
        echo "$$TAG" > /workspace/.image-tag
        echo "Image tag set to: $$TAG"
        cat /workspace/.image-tag
    id: 'set-tag'

  # Build the Django API image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        cd /workspace
        TAG=$$(cat /workspace/.image-tag)
        echo "Building API image with Dockerfile: ./backend-django/Dockerfile"
        echo "Build context: /workspace (full repository root)"
        echo "Current directory: $$(pwd)"
        echo "Checking for requirements-production.txt: $$(ls -la requirements-production.txt 2>&1 || echo 'File not found')"
        docker build \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/api:$$TAG \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/api:latest \
          -f ./backend-django/Dockerfile \
          /workspace
    id: 'build-api'
    waitFor: ['set-tag']

  # Push the API image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TAG=$$(cat /workspace/.image-tag)
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/api:$$TAG
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/api:latest
    id: 'push-api'
    waitFor: ['build-api']

  # Build the Celery Worker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        cd /workspace
        TAG=$$(cat /workspace/.image-tag)
        echo "Building Worker image with Dockerfile: ./orchestration/Dockerfile.celery"
        echo "Build context: /workspace (full repository root)"
        echo "Current directory: $$(pwd)"
        echo "Checking for requirements-production.txt: $$(ls -la requirements-production.txt 2>&1 || echo 'File not found')"
        docker build \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/worker:$$TAG \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/worker:latest \
          -f ./orchestration/Dockerfile.celery \
          /workspace
    id: 'build-worker'
    waitFor: ['set-tag']

  # Push the Worker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TAG=$$(cat /workspace/.image-tag)
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/worker:$$TAG
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/worker:latest
    id: 'push-worker'
    waitFor: ['build-worker']

  # Deploy API to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TAG=$$(cat /workspace/.image-tag)
        # Deploy with explicit annotations for VPC connector and Cloud SQL
        # The connection name format is: PROJECT_ID:REGION:INSTANCE_NAME
        CLOUD_SQL_CONNECTION="${PROJECT_ID}:${_REGION}:nadlaner-postgres"
        VPC_CONNECTOR="projects/${PROJECT_ID}/locations/${_REGION}/connectors/nadlaner-serverless"
        
        gcloud run deploy ${_API_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/api:$$TAG \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --vpc-connector=$$VPC_CONNECTOR \
          --set-cloudsql-instances=$$CLOUD_SQL_CONNECTION \
          --service-account=nadlaner-api@${PROJECT_ID}.iam.gserviceaccount.com \
          --timeout=300 \
          --cpu=2 \
          --memory=2Gi \
          --min-instances=1 \
          --max-instances=10 \
          --port=8000 \
          --update-annotations=run.googleapis.com/startup-cpu-boost=true,run.googleapis.com/ingress=internal-and-cloud-load-balancing
    id: 'deploy-api'
    waitFor: ['push-api']

  # Deploy Worker to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TAG=$$(cat /workspace/.image-tag)
        # Deploy with explicit annotations for VPC connector and Cloud SQL
        # The connection name format is: PROJECT_ID:REGION:INSTANCE_NAME
        CLOUD_SQL_CONNECTION="${PROJECT_ID}:${_REGION}:nadlaner-postgres"
        VPC_CONNECTOR="projects/${PROJECT_ID}/locations/${_REGION}/connectors/nadlaner-serverless"
        
        gcloud run deploy ${_WORKER_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/worker:$$TAG \
          --region=${_REGION} \
          --platform=managed \
          --no-allow-unauthenticated \
          --vpc-connector=$$VPC_CONNECTOR \
          --set-cloudsql-instances=$$CLOUD_SQL_CONNECTION \
          --service-account=nadlaner-worker@${PROJECT_ID}.iam.gserviceaccount.com \
          --cpu=2 \
          --memory=2Gi \
          --min-instances=1 \
          --max-instances=5 \
          --concurrency=1 \
          --update-annotations=run.googleapis.com/startup-cpu-boost=true,run.googleapis.com/ingress=internal
    id: 'deploy-worker'
    waitFor: ['push-worker']

# Substitution variables (set these in Cloud Build triggers or via gcloud)
substitutions:
  _REGION: 'me-west1'
  _REPO_NAME: 'realestate-agent'
  _API_SERVICE_NAME: 'nadlaner-api'
  _WORKER_SERVICE_NAME: 'nadlaner-worker'

# Store images in Artifact Registry (tags will be set dynamically)
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/api:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/worker:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
